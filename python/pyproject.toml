[project]
name = "deepgram-agentcore-payments-examples"
version = "0.1.0"
description = "Call Deepgram on AWS Marketplace (x402) and pay with Amazon Bedrock AgentCore payments"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.44.7",          # first release with ProcessPayment AWS_BILLING_X402
    "requests>=2.32",
    "cryptography>=43",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
strands = ["strands-agents>=1.0"]
langgraph = ["langchain>=1.0", "langchain-aws>=1.0", "langgraph>=1.0"]

[tool.uv]
package = false
